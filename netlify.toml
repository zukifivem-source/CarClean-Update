# Netlify config: plain static site, no build step.
[build]
  publish = "."

# Netlify Email integration (kept from the previous setup)
[functions]
  [functions.emails]
  included_files = ["./emails/**"]

# --- Old URLs → new clean URLs (keeps existing Google rankings) ---
[[redirects]]
  from = "/diensten.html"
  to = "/diensten/"
  status = 301
[[redirects]]
  from = "/over-ons.html"
  to = "/over-ons/"
  status = 301
[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/afspraak.html"
  to = "/afspraak/"
  status = 301
[[redirects]]
  from = "/bedankt-contact"
  to = "/bedankt/"
  status = 301
[[redirects]]
  from = "/bedankt-contact.html"
  to = "/bedankt/"
  status = 301
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# --- Keep developer files off the public site ---
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# --- Security headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# --- Caching ---
# HTML, CSS, JS and images use Netlify's default (always revalidated via ETag), so a new
# deploy is visible immediately even though file names carry no hash. Only the font is
# cached long-term: if you swap it, give it a new file name (see README).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
